# v1 cohort — hand-edit this file; it is the study's scope definition.
# TOML so it is comment-friendly and readable with stdlib `tomllib` (no dependency).
#
# !! EVERY hf_id BELOW IS A SEED AND MUST BE VERIFIED AGAINST THE HUB API BEFORE USE. !!
# They are written from prior familiarity, not from a live read. `scripts/verify_cohort.py`
# (to write) should resolve each id, fail on 404s, and fill architecture/params/dates.
# Release dates are deliberately absent: they are DERIVED (docs/metrics.md §0), never typed.

[meta]
version = "v2"
frozen_on = "2026-10-10"  # v2: rebuilt from Hub data after v1 was found 14 months stale
# A model is eligible only if snapshot_date >= release_date + 30 (full issue window).
min_observation_days = 30

[bands]
primary    = { from = "2025-10-01", to = "2026-09-10" }
historical = { from = "2024-11-01", to = "2025-08-31" }

[inclusion]
# Stated criteria, so the cohort is reproducible rather than taste.
rule = """
1. Text-generation or multimodal-chat weights published on the HF Hub.
2. Open weights with a license permitting local serving.
3. Released >= 30 days before snapshot_date.
4. Either (a) introduces an architecture not previously in the cohort  -> new_arch,
   or (b) is a deliberately chosen control variant of an arch already present -> variant.
5. Weighted toward architecture novelty, NOT toward popularity: novelty is where
   days-to-support carries signal. Downloads are a normalizer, not a selection filter.
6. Two bands. PRIMARY = launches in 2025-10-01..2026-09-10, selected by querying the
   Hub (top-download text-generation and image-text-to-text, deduplicated to the
   earliest repo per architecture, with quant/derivative/republisher/test-fixture repos
   filtered out). HISTORICAL = six verified 2024-11..2025-08 launches, retained so the
   time-trend confound in docs/metrics.md can be measured instead of merely disclaimed.
7. Selection is data-derived, not recalled. v1 of this file was written from model
   knowledge and proved 14 months out of date; candidate generation now runs against
   the live API (raw/hub/candidates_*.json) and every field is API-resolved.
"""
excluded = """
Embedding-only, reranker, ASR, and image-generation models (frameworks in scope are
chat/completion servers; see `not_applicable` state in docs/evidence-rules.md).
OCR and document-parsing models: a large share of 2026 releases, but mostly served
through separate pipelines, so they would contribute `not_applicable` rows rather than
comparable latency. Recorded as out of scope, not as absent.
Quantized, MLX, and GGUF re-publications: derivative artifacts, not launches. Tracked
instead in `quant_artifacts` (docs/metrics.md) because their TIMING is a finding.
"""

[frameworks]
vllm         = { repo = "vllm-project/vllm",   support_via = "code" }
sglang       = { repo = "sgl-project/sglang",  support_via = "code" }
llamacpp     = { repo = "ggml-org/llama.cpp",  support_via = "code" }
ollama       = { repo = "ollama/ollama",       support_via = "library" }
trtllm       = { repo = "NVIDIA/TensorRT-LLM", support_via = "both" }
transformers = { repo = "huggingface/transformers", support_via = "code" }

# ---------------------------------------------------------------------------
# PRIMARY BAND - new architectures (the latency measurement)
# ---------------------------------------------------------------------------

[[models]]
hf_id = "google/gemma-4-31B-it"
family = "gemma4"
support_kind = "new_arch"
band = "primary"
why = "highest-volume launch in the window; a mainstream release is the baseline every other case is read against"
verify = true

[[models]]
hf_id = "Qwen/Qwen3.5-27B"
family = "qwen3.5"
support_kind = "new_arch"
band = "primary"
why = "dense flagship of the most prolific open-weight vendor in the window"
