              "deepseek-r1", "r1", "gemma3", "gemma-3", "gpt-oss", "gptoss",
              "jamba", "olmo2", "olmo-2", "phi-4", "phi4", "nemotron", "qwen2.5-vl", "qwen2_5_vl",
              "llama4", "llama-4", "llama 4", "scout", "maverick", "llama3.3", "llama-3.3"]
ollama_tag = ["qwen3:8b", "qwen3:32b", "qwen3:30b-a3b", "gemma3:27b", "gemma3:4b",
              "deepseek-r1:32b", "gpt-oss:20b", "phi4", "olmo2:13b",
              "llama4:scout", "llama3.3:70b", "nemotron-nano"]
arch_class = ["Qwen3ForCausalLM", "Qwen3MoeForCausalLM", "DeepseekV3ForCausalLM",
              "Gemma3ForConditionalGeneration", "GptOssForCausalLM",
              "JambaForCausalLM", "Olmo2ForCausalLM", "Phi3ForCausalLM",
              "Qwen2_5_VLForConditionalGeneration",
              "Llama4ForConditionalGeneration", "DeciLMForCausalLM", "LlamaForCausalLM"]
# arch_class strings in a traceback are the HIGHEST-confidence match signal available —
# they appear verbatim in "architecture not supported" errors. Weight them above slugs.
